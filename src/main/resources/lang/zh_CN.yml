# ============================================================================
#  Residence 菜单语言文件 - 简体中文 (zh_CN)
# ----------------------------------------------------------------------------
#  所有文本使用 MiniMessage 标签，禁止使用旧版 & 颜色代码：
#    <gray>灰色</gray>  <gold>金色</gold>  <gradient:#ff5555:#ffaa00>渐变</gradient>
#    <bold>粗体</bold>  <italic>斜体</italic>  <underlined>下划线</underlined>
#  花括号 {xxx} 是占位符，例如 {player}、{residence}、{page}。
#  缺失的键会按顺序回退：玩家语言 -> Default 语言 -> 内置资源 -> 显示键名。
#  修改后执行 /res reload lang 立即生效，两套 UI（箱子菜单 / 基岩版表单）同时生效。
# ============================================================================

# ---------------------------------------------------------------------------
# 视觉样式：箱子菜单与基岩表单共用，保证两套 UI 风格一致
# ---------------------------------------------------------------------------
menu:
  style:
    # 菜单名称，显示在标题最前面
    brand: "<gold><bold>Residence</bold></gold>"
    # 标题分隔符，例如 "Residence > 领地" 中的 ">"
    separator: "<dark_gray>»</dark_gray>"
    # 标题模板：{brand} = 菜单名，{separator} = 分隔符，{path} = 当前页面
    title: "{brand}<reset> <gray>菜单</gray>"
    title-page: " <dark_gray>[</dark_gray><gray>{page}</gray><dark_gray>/</dark_gray><gray>{pages}</gray><dark_gray>]</dark_gray>"
    # 说明文字的默认颜色
    description-colour: "<gray>"
    # 操作提示的默认颜色
    hints-colour: "<dark_gray>"
    # 操作提示前的圆点
    bullet: "•"
    # 说明与提示之间的分隔空行（保持为空格即可）
    blank-line: " "
    # 说明文字自动换行宽度（Java 版）
    wrap-width: "52"
    # 说明文字自动换行宽度（基岩版表单更窄）
    wrap-width-bedrock: "42"
    # 边框填充物品的名称与说明（显示为装饰，无功能）
    filler-name: "<dark_gray> </dark_gray>"
    filler-lore:
      - "<dark_gray> "
    # 不可用按钮（如上一页不可用时）使用的材质
    disabled-material: "GRAY_STAINED_GLASS_PANE"

  # -------------------------------------------------------------------------
  # 页面标题（{target} = 页面目标，例如章节名或领地名）
  # -------------------------------------------------------------------------
  title:
    root: ""
    chapter: "{chapter}"
    residence: "<gold>{target}</gold>"
    argument: "<gold>{command}</gold> <dark_gray>·</dark_gray> <gray>第 {step}/{steps} 步</gray>"
    confirm: "<gold>确认执行</gold>"
    language: "<aqua>界面语言</aqua>"

  # -------------------------------------------------------------------------
  # 根菜单章节条目
  # -------------------------------------------------------------------------
  chapter:
    general:
      name: "<white>常规</white>"
      lore: "领地概览、信息查询与创建"
    flags:
      name: "<white>旗帜设置</white>"
      lore: "修改领地旗帜与玩家旗帜"
    ownership:
      name: "<white>所有者</white>"
      lore: "转让、重命名与成员管理"
    areas:
      name: "<white>选区与区域</white>"
      lore: "选择范围、调整大小、子区域与物理区域"
    teleport:
      name: "<white>传送</white>"
      lore: "传送到领地或从中脱困"
    economy:
      name: "<white>经济</white>"
      lore: "市场、金库、商店与租约"
    raid:
      name: "<white>袭击</white>"
      lore: "发起袭击、协防与状态查询"
    chat:
      name: "<white>聊天与消息</white>"
      lore: "领地聊天与进入/离开消息"
    admin:
      name: "<white>管理员</white>"
      lore: "服务器管理命令"
    danger:
      name: "<white>危险操作</white>"
      lore: "不可撤销的破坏性操作，请谨慎使用"
    # 每个章节显示的条目数量
    count: "<dark_gray>{count} 个命令</dark_gray>"

  # -------------------------------------------------------------------------
  # 按钮（可被 config.yml 的 Layout.Buttons 覆盖材质/槽位）
  # -------------------------------------------------------------------------
  button:
    previous:
      name: "<green>上一页</green>"
      disabled-name: "<dark_gray>已是第一页</dark_gray>"
      lore:
        - "<gray>翻到第 {page}/{pages} 页</gray>"
        - ""
        - "<dark_gray>• 左键 翻页</dark_gray>"
    next:
      name: "<green>下一页</green>"
      disabled-name: "<dark_gray>已是最后一页</dark_gray>"
      lore:
        - "<gray>翻到第 {page}/{pages} 页</gray>"
        - ""
        - "<dark_gray>• 左键 翻页</dark_gray>"
    page_indicator:
      name: "<gold>{page}</gold> <dark_gray>/</dark_gray> <gray>{pages}</gray>"
      lore:
        - "<gray>当前页：{page}/{pages}</gray>"
    back:
      name: "<yellow>返回</yellow>"
      lore:
        - "<gray>回到上一级菜单</gray>"
        - ""
        - "<dark_gray>• 左键 返回</dark_gray>"
    close:
      name: "<red>关闭</red>"
      lore:
        - "<gray>关闭菜单</gray>"
        - ""
        - "<dark_gray>• 左键 关闭</dark_gray>"
    info:
      name: "<aqua>信息</aqua>"
      lore:
        - "<gray>关于当前页面的说明</gray>"
    language:
      name: "<aqua>界面语言</aqua>"
      lore:
        - "<gray>当前语言：<white>{languageName}</white></gray>"
        - ""
        - "<dark_gray>• 左键 切换语言</dark_gray>"
    language_entry:
      name: "<white>{languageName}</white>"
    current_residence:
      name: "<green>{residence}</green>"
      lore:
        - "<gray>所有者：<white>{owner}</white></gray>"
        - "<dark_gray>你正站在此领地中</dark_gray>"
        - ""
        - "<dark_gray>• 左键 管理此领地</dark_gray>"
    current_residence_empty:
      name: "<gray>当前没有领地</gray>"
      lore:
        - "<gray>走到领地范围内即可在此管理</gray>"
    quick_flags:
      name: "<yellow>快速旗帜编辑</yellow>"
      lore:
        - "<gray>打开你所在领地的旗帜设置</gray>"
        - ""
        - "<dark_gray>• 左键 打开</dark_gray>"
    residence_list:
      name: "<aqua>领地列表</aqua>"
      lore:
        - "<gray>查看你拥有的全部领地</gray>"
        - ""
        - "<dark_gray>• 左键 查看</dark_gray>"
    confirm:
      name: "<green>确认执行</green>"
      lore:
        - "<gray>立即执行命令：</gray>"
        - "<white>{line}</white>"
        - ""
        - "<dark_gray>• 左键 确认</dark_gray>"
    confirm_danger:
      name: "<red><bold>确认执行（危险）</bold></red>"
      lore:
        - "<red>此操作不可撤销！</red>"
        - "<white>{line}</white>"
        - ""
        - "<dark_gray>• 左键 确认</dark_gray>"
    cancel:
      name: "<red>取消</red>"
      lore:
        - "<gray>不执行此命令</gray>"
    command_preview:
      name: "<yellow>命令预览</yellow>"
      lore:
        - "<gray>将要执行的完整命令：</gray>"
        - "<white>{line}</white>"
    type_in_chat:
      name: "<yellow>在聊天框中输入</yellow>"
      lore:
        - "<gray>用键盘输入<white>{label}</white>，输入设备均可</gray>"
        - ""
        - "<dark_gray>• 左键 开始输入</dark_gray>"
    type_manually:
      name: "<gray>自己输入命令</gray>"
      lore:
        - "<gray>关闭菜单并将命令填入聊天框</gray>"
        - "<dark_gray>{line}</dark_gray>"
    value_minus:
      name: "<red>- {step}</red>"
      lore:
        - "<gray>减少 <white>{step}</white></gray>"
        - ""
        - "<dark_gray>• 左键 减少</dark_gray>"
    value_plus:
      name: "<green>+ {step}</green>"
      lore:
        - "<gray>增加 <white>{step}</white></gray>"
        - ""
        - "<dark_gray>• 左键 增加</dark_gray>"
    value_current:
      name: "<gold>{value}</gold>"
      lore:
        - "<gray>最小值：<white>{min}</white></gray>"
        - "<gray>最大值：<white>{max}</white></gray>"
    value_use:
      name: "<green>使用 {value}</green>"
      lore:
        - "<gray>以该数值继续</gray>"
        - ""
        - "<dark_gray>• 左键 使用</dark_gray>"

  # -------------------------------------------------------------------------
  # 空状态占位物品
  # -------------------------------------------------------------------------
  empty:
    residence:
      name: "<gray>没有可用的领地</gray>"
      lore:
        - "<gray>你还没有领地，或没有权限操作任何领地</gray>"
    player:
      name: "<gray>没有其他在线玩家</gray>"
      lore:
        - "<gray>当前没有其他玩家在线</gray>"
    member:
      name: "<gray>没有成员</gray>"
      lore:
        - "<gray>此领地还没有添加其他玩家</gray>"
    flag:
      name: "<gray>没有可用旗帜</gray>"
      lore:
        - "<gray>你没有权限修改任何旗帜</gray>"
    group:
      name: "<gray>没有权限组</gray>"
      lore:
        - "<gray>groups.yml 中没有可用权限组</gray>"
    world:
      name: "<gray>没有世界</gray>"
      lore:
        - "<gray>服务器没有加载任何世界</gray>"
    choice:
      name: "<gray>没有可选项</gray>"
      lore:
        - "<gray>此参数没有可选的选项</gray>"
    section:
      name: "<gray>这里空空如也</gray>"
      lore:
        - "<gray>当前页面没有内容</gray>"
    action:
      name: "<gray>没有可用操作</gray>"
      lore:
        - "<gray>你没有权限执行此处的操作</gray>"

  # -------------------------------------------------------------------------
  # 操作提示（hover lore 底部）
  # -------------------------------------------------------------------------
  hint:
    left_click: "<dark_gray>左键</dark_gray> <gray>选择</gray>"
    right_click: "<dark_gray>右键</dark_gray> <gray>查看详情</gray>"
    shift_click: "<dark_gray>Shift+左键</dark_gray> <gray>快速操作</gray>"
    middle_click: "<dark_gray>中键</dark_gray> <gray>复制</gray>"
    selected: "<dark_gray>当前选中</dark_gray>"

  # -------------------------------------------------------------------------
  # 列表条目
  # -------------------------------------------------------------------------
  item:
    residence:
      owner: "<gray>所有者：<white>{owner}</white></gray>"
      world: "<gray>世界：<white>{world}</white></gray>"
      subzones: "<gray>子区域：<white>{subzones}</white></gray>"
      for-rent: "<green>可出租</green>"
      for-sale: "<green>可出售</green>"
      here: "<aqua>你正站在这里</aqua>"
    player:
      world: "<gray>所在世界：<white>{world}</white></gray>"
    flag:
      desc: "<gray>{desc}</gray>"
      mode: "<gray>适用范围：<white>{mode}</white></gray>"
    world:
      players: "<gray>在线玩家：<white>{players}</white></gray>"
    choice:
      value: "<gray>取值：<white>{value}</white></gray>"
    state:
      desc: "<gray>旗帜状态</gray>"

  # -------------------------------------------------------------------------
  # 参数、状态与选项
  # -------------------------------------------------------------------------
  argument:
    skip: "<gray>（跳过此项）</gray>"
    skip-lore: "<gray>不填写此可选参数，直接继续</gray>"
    number-value: "<aqua>{value}</aqua>"
    number-value-lore: "<gray>将数值设为 <white>{value}</white></gray>"

  state:
    "true": "<green>开启</green>"
    "false": "<red>关闭</red>"
    remove: "<gray>移除</gray>"

  choice:
    list: "<white>列表</white>"
    add: "<green>添加</green>"
    remove: "<red>移除</red>"
    apply: "<aqua>应用</aqua>"
    set: "<white>设置</white>"
    pset: "<white>玩家设置</white>"
    gset: "<white>权限组设置</white>"
    view: "<white>查看</white>"
    allow: "<green>允许</green>"
    block: "<red>禁止</red>"
    sell: "<green>出售</green>"
    unsell: "<gray>取消出售</gray>"
    buy: "<green>购买</green>"
    rent: "<aqua>租用</aqua>"
    rentable: "<aqua>设为可租</aqua>"
    autopay: "<aqua>自动续费</aqua>"
    payrent: "<aqua>支付租金</aqua>"
    release: "<red>释放</red>"
    unrent: "<red>取消租用</red>"
    sign: "<white>告示牌</white>"
    confirm: "<gold>确认</gold>"
    balance: "<gold>余额</gold>"
    deposit: "<green>存入</green>"
    withdraw: "<red>取出</red>"
    vote: "<green>点赞</green>"
    like: "<green>喜欢</green>"
    votes: "<gray>点赞数</gray>"
    likes: "<gray>喜欢数</gray>"
    setdesc: "<white>设置描述</white>"
    createboard: "<white>创建排行榜</white>"
    deleteboard: "<red>删除排行榜</red>"
    cost: "<gold>费用</gold>"
    renew: "<green>续期</green>"
    expires: "<gray>到期时间</gray>"
    start: "<green>开始</green>"
    stop: "<red>停止</red>"
    kick: "<red>踢出</red>"
    immunity: "<aqua>免疫</aqua>"
    take: "<red>扣除</red>"
    clear: "<gray>清空</gray>"
    join: "<green>加入</green>"
    leave: "<red>离开</red>"
    setcolor: "<aqua>设置颜色</aqua>"
    setprefix: "<aqua>设置前缀</aqua>"
    enter: "<green>进入</green>"
    on: "<green>开启</green>"
    off: "<red>关闭</red>"
    coords: "<white>坐标</white>"
    size: "<white>大小</white>"
    vert: "<white>垂直</white>"
    sky: "<white>天空</white>"
    bedrock: "<white>基岩</white>"
    expand: "<white>扩展</white>"
    shift: "<white>平移</white>"
    chunk: "<white>区块</white>"
    residence: "<white>领地</white>"
    worldedit: "<white>WorldEdit</white>"
    options: "<white>选项</white>"
    outward: "<white>向外</white>"
    listall: "<white>全部列表</white>"
    blacklist: "<red>黑名单</red>"
    ignorelist: "<gray>忽略列表</gray>"
    info: "<aqua>信息</aqua>"
    replace: "<white>替换</white>"
    config: "<white>配置</white>"
    lang: "<white>语言</white>"
    groups: "<white>权限组</white>"
    flags: "<white>旗帜</white>"

  flagmode:
    residence: "<white>领地</white>"
    player: "<white>玩家</white>"

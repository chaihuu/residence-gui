# ============================================================================
#  Residence menu language file - English (en_US)
# ----------------------------------------------------------------------------
#  Every string uses MiniMessage tags, legacy & colour codes are not supported:
#    <gray>gray</gray>  <gold>gold</gold>  <gradient:#ff5555:#ffaa00>gradient</gradient>
#    <bold>bold</bold>  <italic>italic</italic>  <underlined>underline</underlined>
#  Braces {xxx} are placeholders such as {player}, {residence} and {page}.
#  A missing key falls back to: player language -> Default language -> bundled
#  resource -> the key name itself.
#  Run /res reload lang to apply changes; both user interfaces (chest menu and
#  Bedrock form) switch at once because they share this file.
# ============================================================================

# ---------------------------------------------------------------------------
# Visual style - shared by the chest menu and the Bedrock form so both look
# identical.
# ---------------------------------------------------------------------------
menu:
  style:
    # Menu name shown at the start of every title
    brand: "<gold><bold>Residence</bold></gold>"
    # Separator between the brand and the page path
    separator: "<dark_gray>»</dark_gray>"
    # Title template: {brand}, {separator}, {path}
    title: "{brand}<reset> <gray>Menu</gray>"
    title-page: " <dark_gray>[</dark_gray><gray>{page}</gray><dark_gray>/</dark_gray><gray>{pages}</gray><dark_gray>]</dark_gray>"
    # Default colour of description lines
    description-colour: "<gray>"
    # Default colour of the hint lines
    hints-colour: "<dark_gray>"
    # Bullet in front of a hint
    bullet: "•"
    # Filler used as an empty tooltip line (a single space is enough)
    blank-line: " "
    # Wrap width of description lines (Java client)
    wrap-width: "52"
    # Wrap width of description lines (Bedrock client, narrower dialog)
    wrap-width-bedrock: "42"
    # Name and lore of the border filler item
    filler-name: "<dark_gray> </dark_gray>"
    filler-lore:
      - "<dark_gray> "
    # Material of a button that cannot be used, e.g. "previous page" on page 1
    disabled-material: "GRAY_STAINED_GLASS_PANE"

  # -------------------------------------------------------------------------
  # Screen titles ({target} = chapter name, residence name ...)
  # -------------------------------------------------------------------------
  title:
    root: ""
    chapter: "{chapter}"
    residence: "<gold>{target}</gold>"
    argument: "<gold>{command}</gold> <dark_gray>·</dark_gray> <gray>step {step}/{steps}</gray>"
    confirm: "<gold>Confirm</gold>"
    language: "<aqua>Language</aqua>"

  # -------------------------------------------------------------------------
  # Chapters of the root screen
  # -------------------------------------------------------------------------
  chapter:
    general:
      name: "<white>General</white>"
      lore: "Overview, information and creating residences"
    flags:
      name: "<white>Flags</white>"
      lore: "Change residence flags and player flags"
    ownership:
      name: "<white>Ownership</white>"
      lore: "Transfer, rename and manage members"
    areas:
      name: "<white>Selection & Areas</white>"
      lore: "Select, resize, subzones and physical areas"
    teleport:
      name: "<white>Teleport</white>"
      lore: "Teleport to a residence or out of it"
    economy:
      name: "<white>Economy</white>"
      lore: "Market, bank, shop and leases"
    raid:
      name: "<white>Raids</white>"
      lore: "Start, defend and monitor raids"
    chat:
      name: "<white>Chat & Messages</white>"
      lore: "Residence chat and enter/leave messages"
    admin:
      name: "<white>Admin</white>"
      lore: "Server administration commands"
    danger:
      name: "<white>Danger zone</white>"
      lore: "Destructive operations that cannot be undone"
    # Number of commands shown inside a chapter entry
    count: "<dark_gray>{count} command(s)</dark_gray>"

  # -------------------------------------------------------------------------
  # Buttons (material and slot can be overridden in config.yml Layout.Buttons)
  # -------------------------------------------------------------------------
  button:
    previous:
      name: "<green>Previous page</green>"
      disabled-name: "<dark_gray>Already on the first page</dark_gray>"
      lore:
        - "<gray>Go to page {page}/{pages}</gray>"
        - ""
        - "<dark_gray>• Left click to change page</dark_gray>"
    next:
      name: "<green>Next page</green>"
      disabled-name: "<dark_gray>Already on the last page</dark_gray>"
      lore:
        - "<gray>Go to page {page}/{pages}</gray>"
        - ""
        - "<dark_gray>• Left click to change page</dark_gray>"
    page_indicator:
      name: "<gold>{page}</gold> <dark_gray>/</dark_gray> <gray>{pages}</gray>"
      lore:
        - "<gray>Current page: {page}/{pages}</gray>"
    back:
      name: "<yellow>Back</yellow>"
      lore:
        - "<gray>Return to the previous screen</gray>"
        - ""
        - "<dark_gray>• Left click to go back</dark_gray>"
    close:
      name: "<red>Close</red>"
      lore:
        - "<gray>Close this menu</gray>"
        - ""
        - "<dark_gray>• Left click to close</dark_gray>"
    info:
      name: "<aqua>Information</aqua>"
      lore:
        - "<gray>About this screen</gray>"
    language:
      name: "<aqua>Language</aqua>"
      lore:
        - "<gray>Current language: <white>{languageName}</white></gray>"
        - ""
        - "<dark_gray>• Left click to switch language</dark_gray>"
    language_entry:
      name: "<white>{languageName}</white>"
    current_residence:
      name: "<green>{residence}</green>"
      lore:
        - "<gray>Owner: <white>{owner}</white></gray>"
        - "<dark_gray>You are standing in this residence</dark_gray>"
        - ""
        - "<dark_gray>• Left click to manage it</dark_gray>"
    current_residence_empty:
      name: "<gray>No residence here</gray>"
      lore:
        - "<gray>Walk into a residence to manage it here</gray>"
    quick_flags:
      name: "<yellow>Quick flag editor</yellow>"
      lore:
        - "<gray>Open the flags of the residence you stand in</gray>"
        - ""
        - "<dark_gray>• Left click to open</dark_gray>"
    residence_list:
      name: "<aqua>Residence list</aqua>"
      lore:
        - "<gray>Browse every residence you own</gray>"
        - ""
        - "<dark_gray>• Left click to browse</dark_gray>"
    confirm:
      name: "<green>Confirm</green>"
      lore:
        - "<gray>Run this command:</gray>"
        - "<white>{line}</white>"
        - ""
        - "<dark_gray>• Left click to confirm</dark_gray>"
    confirm_danger:
      name: "<red><bold>Confirm (dangerous)</bold></red>"
      lore:
        - "<red>This cannot be undone!</red>"
        - "<white>{line}</white>"
        - ""
        - "<dark_gray>• Left click to confirm</dark_gray>"
    cancel:
      name: "<red>Cancel</red>"
      lore:
        - "<gray>Do not run this command</gray>"
    command_preview:
      name: "<yellow>Command preview</yellow>"
      lore:
        - "<gray>This is what will run:</gray>"
        - "<white>{line}</white>"
    type_in_chat:
      name: "<yellow>Type it in chat</yellow>"
      lore:
        - "<gray>Type <white>{label}</white> in chat, works with every input device</gray>"
        - ""
        - "<dark_gray>• Left click to start typing</dark_gray>"
    type_manually:
      name: "<gray>Type the command myself</gray>"
      lore:
        - "<gray>Closes the menu and puts the command into the chat box</gray>"
        - "<dark_gray>{line}</dark_gray>"
    value_minus:
      name: "<red>- {step}</red>"
      lore:
        - "<gray>Lower the value by <white>{step}</white></gray>"
        - ""
        - "<dark_gray>• Left click to lower</dark_gray>"
    value_plus:
      name: "<green>+ {step}</green>"
      lore:
        - "<gray>Raise the value by <white>{step}</white></gray>"
        - ""
        - "<dark_gray>• Left click to raise</dark_gray>"
    value_current:
      name: "<gold>{value}</gold>"
      lore:
        - "<gray>Minimum: <white>{min}</white></gray>"
        - "<gray>Maximum: <white>{max}</white></gray>"
    value_use:
      name: "<green>Use {value}</green>"
      lore:
        - "<gray>Continue with this value</gray>"
        - ""
        - "<dark_gray>• Left click to use</dark_gray>"


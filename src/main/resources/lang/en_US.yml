    not-in-residence: "You are not standing in a residence"
    argument: "Step {step}/{steps}: choose {label}"
    confirm: "Will run: {line}"
    confirm-danger: "Careful: this cannot be undone!"
    language: "Pick the menu language, the change applies immediately"
    page: "Page {page}/{pages}"
    selected-marker: "✔ "

  # -------------------------------------------------------------------------
  # Chat prompts and messages
  # -------------------------------------------------------------------------
  prompt:
    chat-input: "<yellow>Type {label} for {command} in chat, or type cancel to abort:</yellow>"
    cancel: "cancel"
    suggest: "<gray>The command is in your chat box, edit it and press enter</gray>"

  message:
    disabled: "<red>The Residence menu is disabled on this server</red>"
    unknown-command: "<red>Unknown command <white>{command}</white>, it is not part of the menu</red>"
    input-cancelled: "<yellow>Input cancelled</yellow>"
    input-empty: "<red>Please type a value, or type cancel to abort</red>"
    dispatch-failed: "<red>The command could not run: <white>{command}</white></red>"
    join: "<gray>Open the residence menu with <click:run_command:'/res menu'><hover:show_text:'<gray>Open the Residence menu</gray>'><gold>/res menu</gold></hover></click></gray>"
    join-bedrock: "<gray>Use <click:run_command:'/res menu'><gold>/res menu</gold></click> for a form that is easier to use on Bedrock</gray>"

  # Words that abort a chat input, also used on Bedrock
  cancel-words:
    - "cancel"
    - "cancelar"
    - "取消"

  # -------------------------------------------------------------------------
  # /res menu check output
  # -------------------------------------------------------------------------
  check:
    title: "<gold><bold>Residence menu language check</bold></gold>"
    active: "<gray>Active language: <white>{language}</white> (client: <white>{detected}</white>)</gray>"
    default: "<gray>Default language: <white>{language}</white></gray>"
    available: "<gray>Loaded languages: <white>{languages}</white></gray>"
    missing-title: "<yellow>{language} is missing {count} key(s):</yellow>"
    missing-more: "<dark_gray>... and {count} more</dark_gray>"
    missing-entry: "<dark_gray>  · {key}</dark_gray>"
    runtime-title: "<yellow>Keys not found at runtime: {count}</yellow>"
